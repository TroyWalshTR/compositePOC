name: Run tests

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Playwright browser
        type: choice
        options: [chromium, firefox, webkit]
        default: chromium
      grep:
        description: Test title regular expression (empty runs all tests)
        type: string
        default: ''
  workflow_run:
    workflows: [Trigger tests]
    types: [completed]

permissions:
  contents: read

jobs:
  test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROWSER: ${{ inputs.browser || 'chromium' }}
      GREP: ${{ inputs.grep || '' }}
    steps:
      - name: Download source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Set up Playwright
        run: |
          case "$BROWSER" in
            chromium|firefox|webkit) ;;
            *) echo "Unsupported browser"; exit 1 ;;
          esac
          npx playwright install --with-deps "$BROWSER"
      - name: Run tests
        id: tests
        run: npm test -- --project="$BROWSER" --grep="$GREP"
      - name: Write test summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          {
            printf '## Test results\n\nOutcome: %s\n\n### Input parameters\n\n' "$TEST_OUTCOME"
            node -e 'console.log(JSON.stringify({browser: process.env.BROWSER, grep: process.env.GREP}, null, 2))' | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
